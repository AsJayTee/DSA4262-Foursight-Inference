[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "m6a"
version = "0.1.0"
description = "m6A RNA modification prediction from Nanopore direct RNA-seq (DSA4262 Foursight)"
requires-python = ">=3.10"

# Everything the prediction script imports. The shipped model runs in plain numpy;
# scikit-learn is used by the output-format check (m6a.evaluation).
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
